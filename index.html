<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD Shop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0f172a;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
color:#22c55e;
}

.search{
width:50%;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
}

.hero{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
padding:60px 20px;
text-align:center;
}

.hero h1{
font-size:40px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
}

.btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
background:white;
color:#16a34a;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

@media(max-width:700px){
header{
flex-direction:column;
gap:15px;
}

.search{
width:100%;
}

.hero h1{
font-size:28px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">BD Shop</div>

<div class="search">
<input type="text" placeholder="Search products...">
</div>
</header>

<section class="hero">
<h1>Welcome to BD Shop</h1>
<p>বাংলাদেশের বিশ্বস্ত অনলাইন শপ</p>

<a href="#" class="btn">Shop Now</a>

</section>

</body>
</html>
