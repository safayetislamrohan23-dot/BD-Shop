<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD-Shop</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{
background:#008000;
color:white;
padding:20px;
text-align:center;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

.card{
background:white;
width:220px;
margin:15px;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

button{
background:#008000;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#006400;
}
</style>
</head>

<body>

<header>
<h1>BD-Shop</h1>
<p>Welcome to our online shop</p>
</header>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Sample Product</h3>
<p>Price: 500 Tk</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Sample Product 2</h3>
<p>Price: 700 Tk</p>
<button>Buy Now</button>
</div>

</div>

</body>
  </html>
